[package]
name = "diff"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.10.0", default-features = false, features = ["component", "assets"] }
similar = { version = "3.1.1", features = ["unicode"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"

[profile.dev.package]
gpui-pre = { opt-level = 1 }
gpui-component = { opt-level = 1 }
gpui-kit = { opt-level = 1 }
gpui-kit-assets = { opt-level = 1 }
gpui-pre-platform = { opt-level = 1 }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
