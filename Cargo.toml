[package]
name = "textdiff"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
env_logger = "0.11.11"
log = "0.4.33"
similar = "3.1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[dev-dependencies]
similar = "3.0"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
