<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Text Diff — compare text, locally</title>
    <script>
        // gpui-pre-web 0.3.12 sizes the canvas backing store in CSS pixels,
        // then divides devicePixelContentBoxSize by the DPR. On Retina/high-DPI
        // displays that halves the logical viewport, so force its CSS-pixel
        // fallback path instead.
        if (window.devicePixelRatio !== 1) {
            try {
                delete ResizeObserverEntry.prototype.devicePixelContentBoxSize;
            } catch (_) {
                // Prototype is not configurable in this browser; use the default path.
            }
        }
    </script>
    <link data-trunk rel="rust" data-bin="diff" data-bindgen-target="web" data-wasm-opt="0" />
    <link data-trunk rel="copy-file" href="_headers" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0B0C0E;
            color: #E8EAED;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body > canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            user-select: none;
        }

        #loading {
            position: fixed;
            z-index: 1;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0B0C0E;
            transition: opacity 180ms ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .mark {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #E8EAED;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid #24262B;
            border-top-color: #E8EAED;
            border-radius: 50%;
            animation: spin 900ms linear infinite;
        }

        #loading p {
            font-size: 13px;
            color: #8B909A;
        }

        #loading .error {
            max-width: 34rem;
            padding: 0 24px;
            color: #D9777F;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            white-space: pre-wrap;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="mark">Text Diff</div>
        <div class="spinner"></div>
        <p>Loading Text Diff…</p>
    </div>
    <script>
        (() => {
            const loading = document.getElementById("loading");
            const started = Date.now();

            const fail = (message) => {
                loading.innerHTML = `<p class="error">${message}</p>`;
            };

            const reveal = () => {
                const canvas = document.querySelector("body > canvas");
                if (!canvas) return false;
                loading.classList.add("hidden");
                setTimeout(() => loading.remove(), 220);
                return true;
            };

            const observer = new MutationObserver(() => {
                if (reveal()) observer.disconnect();
            });
            observer.observe(document.body, { childList: true });

            window.addEventListener("error", (event) => {
                if (!document.querySelector("body > canvas")) {
                    fail(event.message || "The application failed to start.");
                }
            });

            setTimeout(() => {
                if (!document.querySelector("body > canvas")) {
                    fail(
                        "The application did not start. Open the browser console for details.\n\n" +
                        "This build needs WebGPU or WebGL2 and cross-origin isolation.",
                    );
                    console.error("Text Diff failed to start after", Date.now() - started, "ms");
                }
            }, 30000);
        })();
    </script>
</body>
</html>
