<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Text Diff — compare text, locally</title>
    <script>
        // gpui-pre-web 0.3.12 sizes the canvas backing store in CSS pixels,
        // then divides devicePixelContentBoxSize by the DPR. On Retina/high-DPI
        // displays that halves the logical viewport, so force its CSS-pixel
        // fallback path instead.
        if (window.devicePixelRatio !== 1) {
            try {
                delete ResizeObserverEntry.prototype.devicePixelContentBoxSize;
            } catch (_) {
                // Prototype is not configurable in this browser; use the default path.
            }
        }
    </script>
    <link data-trunk rel="rust" data-bin="diff" data-bindgen-target="web" data-wasm-opt="0" />
    <link data-trunk rel="copy-file" href="_headers" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0B0C0E;
            color: #E8EAED;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body > canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            user-select: none;
        }

        #loading {
            position: fixed;
            z-index: 1;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0B0C0E;
            transition: opacity 180ms ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .mark {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #E8EAED;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid #24262B;
            border-top-color: #E8EAED;
            border-radius: 50%;
            animation: spin 900ms linear infinite;
        }

        #loading p {
            font-size: 13px;
            color: #8B909A;
        }

        #loading .error {
            max-width: 34rem;
            padding: 0 24px;
            color: #D9777F;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            white-space: pre-wrap;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <input
        id="file-input"
        type="file"
        hidden
        accept="text/*,.txt,.md,.markdown,.log,.csv,.json,.toml,.yaml,.yml,.ini,.cfg,.rs,.js,.mjs,.ts,.tsx,.jsx,.html,.css,.py,.go,.java,.c,.h,.cc,.cpp,.hpp,.sh,.xml,.sql"
    />
    <div id="loading">
        <div class="mark">Text Diff</div>
        <div class="spinner"></div>
        <p>Loading Text Diff…</p>
    </div>
    <script>
        (() => {
            const loading = document.getElementById("loading");
            const started = Date.now();

            const fail = (message) => {
                loading.innerHTML = `<p class="error">${message}</p>`;
            };

            const reveal = () => {
                const canvas = document.querySelector("body > canvas");
                if (!canvas) return false;
                loading.classList.add("hidden");
                setTimeout(() => loading.remove(), 220);
                return true;
            };

            const observer = new MutationObserver(() => {
                if (reveal()) observer.disconnect();
            });
            observer.observe(document.body, { childList: true });

            window.addEventListener("error", (event) => {
                if (!document.querySelector("body > canvas")) {
                    fail(event.message || "The application failed to start.");
                }
            });

            setTimeout(() => {
                if (!document.querySelector("body > canvas")) {
                    fail(
                        "The application did not start. Open the browser console for details.\n\n" +
                        "This build needs WebGPU or WebGL2 and cross-origin isolation.",
                    );
                    console.error("Text Diff failed to start after", Date.now() - started, "ms");
                }
            }, 30000);
        })();
    </script>
    <script>
        (() => {
            const MAX_FILE_BYTES = 10 * 1024 * 1024;
            const input = document.getElementById("file-input");
            let targetPane = "original";

            const bindings = () => window.wasmBindings;

            const showError = (message) => {
                const wasm = bindings();
                if (wasm && typeof wasm.report_file_error === "function") {
                    wasm.report_file_error(String(message));
                } else {
                    console.error(message);
                }
            };

            const paneAt = (clientX) => {
                const canvas = document.querySelector("body > canvas");
                if (!canvas) return "original";
                const rect = canvas.getBoundingClientRect();
                return clientX < rect.left + rect.width / 2 ? "original" : "modified";
            };

            const loadFile = async (pane, file) => {
                if (!file) return;

                if (file.size > MAX_FILE_BYTES) {
                    const megabytes = (file.size / (1024 * 1024)).toFixed(1);
                    showError(`${file.name} is too large (${megabytes} MB). The limit is 10 MB.`);
                    return;
                }

                let text;
                try {
                    const buffer = await file.arrayBuffer();
                    text = new TextDecoder("utf-8", { fatal: true }).decode(buffer);
                } catch (_) {
                    showError(`${file.name} is not valid UTF-8 text.`);
                    return;
                }

                const wasm = bindings();
                if (!wasm || typeof wasm.load_file_text !== "function") {
                    showError("The file loader is still starting. Try again in a moment.");
                    return;
                }
                wasm.load_file_text(pane, file.name, text);
            };

            window.diffOpenFile = (pane) => {
                targetPane = pane === "modified" ? "modified" : "original";
                input.value = "";
                input.click();
            };

            input.addEventListener("change", () => {
                const file = input.files && input.files[0];
                if (file) loadFile(targetPane, file);
                input.value = "";
            });

            window.addEventListener("dragover", (event) => {
                const types = event.dataTransfer && event.dataTransfer.types;
                if (types && Array.from(types).includes("Files")) {
                    event.preventDefault();
                    event.dataTransfer.dropEffect = "copy";
                }
            });

            window.addEventListener("drop", (event) => {
                const files = event.dataTransfer && event.dataTransfer.files;
                if (!files || files.length === 0) return;
                event.preventDefault();
                loadFile(paneAt(event.clientX), files[0]);
            });
        })();
    </script>
</body>
</html>
